name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Descompactar o projeto (projeto.zip)
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Usando: $ZIP"
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          SETTINGS=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          DIR=$(dirname "$SETTINGS")
          echo "Projeto em: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compilar o APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" EditorPro.apk

      - name: Publicar em Releases (para baixar pelo celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" EditorPro.apk \
            --repo "${{ github.repository }}" \
            --title "Editor Pro v${{ github.run_number }}" \
            --notes "APK pronto para instalar. Baixe o arquivo EditorPro.apk abaixo."

      - name: Guardar também como artefato
        uses: actions/upload-artifact@v4
        with:
          name: EditorPro-apk
          path: EditorPro.apk
